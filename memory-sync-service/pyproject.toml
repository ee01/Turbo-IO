[project]
name = "turboio-memory-sync"
version = "0.1.0"
description = "Local receiver for Turbo IO glasses transcripts. Loopback by default; file archive is the downstream contract."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
memory-sync = "memory_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
